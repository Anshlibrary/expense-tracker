{% extends 'base.html' %}

{% block content %}

<h2>Update Expense</h2>

<form method="POST">

    <input
        type="text"
        name="date"
        value="{{ expense.date }}"
        class="form-control mb-2"
    >

    <input
        type="text"
        name="category"
        value="{{ expense.category }}"
        class="form-control mb-2"
    >

    <input
        type="text"
        name="description"
        value="{{ expense.description }}"
        class="form-control mb-2"
    >

    <input
        type="number"
        step="0.01"
        name="amount"
        value="{{ expense.amount }}"
        class="form-control mb-2"
    >

    <button class="btn btn-primary">
        Update
    </button>

</form>

{% endblock %}
