{% extends 'base.html' %}

{% block content %}

<h1 class="mb-4">Update Expense</h1>

<form method="POST">

    <div class="mb-3">

        <input
        type="date"
        name="date"
        value="{{ expense.expense_date }}"
        class="form-control"
        required
        >

    </div>

     <div class="mb-3">

        <input
        type="text"
        name="category"
        value="{{ expense.category }}"
        class="form-control"
        required
        >

    </div>

    <div class="mb-3">

        <input
        type="text"
        name="description"
        value="{{ expense.description }}"
        class="form-control"
        required
        >

    </div>

     <div class="mb-3">

        <input
        type="number"
        step="0.01"
        name="amount"
        value="{{ expense.amount }}"
        class="form-control"
        required
        >

    </div>

    <button class="btn btn-primary">
        Update Expense
    </button>

</form>

{% endblock %}
