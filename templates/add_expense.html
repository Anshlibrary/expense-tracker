{% extends 'base.html' %}

{% block content %}

<h2>Add Expense</h2>

<form method="POST">

    <input
        type="text"
        name="date"
        placeholder="Date"
        class="form-control mb-2"
    >

    <input
        type="text"
        name="category"
        placeholder="Category"
        class="form-control mb-2"
    >

    <input
        type="text"
        name="description"
        placeholder="Description"
        class="form-control mb-2"
    >

    <input
        type="number"
        step="0.01"
        name="amount"
        placeholder="Amount"
        class="form-control mb-2"
    >

    <button class="btn btn-success">
        Add Expense
    </button>

</form>

{% endblock %}
